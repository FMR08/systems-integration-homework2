server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventario}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:integracion}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:integracion_dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
