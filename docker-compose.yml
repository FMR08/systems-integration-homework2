services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-integracion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-integracion_dev}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  inventario:
    build: ./inventario
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventario
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-integracion}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-integracion_dev}
    ports:
      - "8081:8080"
    depends_on:
      postgres: { condition: service_healthy }

  transportista:
    build: ./transportista
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transportista
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-integracion}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-integracion_dev}
    ports:
      - "8082:8080"
    depends_on:
      postgres: { condition: service_healthy }

  tracking:
    build: ./tracking
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tracking
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-integracion}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-integracion_dev}
    ports:
      - "8083:8080"
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres_data:
