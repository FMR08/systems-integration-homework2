server.port=${SERVER_PORT:8085}

servicios.orquestador.url=${ORQUESTADOR_URL:http://localhost:8084}
servicios.inventario.url=${INVENTARIO_URL:http://localhost:8081}
servicios.transportista.url=${TRANSPORTISTA_URL:http://localhost:8082}
servicios.tracking.url=${TRACKING_URL:http://localhost:8083}

management.endpoints.web.exposure.include=health,metrics,circuitbreakers,circuitbreakerevents,bulkheads,bulkheadevents
management.health.circuitbreakers.enabled=true

# Circuit Breaker por dependencia secundaria (degradación elegante en la vista agregada)
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=6
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=4
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=1s
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.ignore-exceptions=org.springframework.web.client.HttpClientErrorException,io.github.resilience4j.bulkhead.BulkheadFullException
resilience4j.circuitbreaker.instances.transportista.base-config=default
resilience4j.circuitbreaker.instances.tracking.base-config=default
resilience4j.circuitbreaker.instances.inventario.base-config=default

# Bulkhead: la lentitud del transportista no consume todos los hilos del BFF
resilience4j.bulkhead.instances.transportista.max-concurrent-calls=3
resilience4j.bulkhead.instances.transportista.max-wait-duration=0
resilience4j.bulkhead.instances.tracking.max-concurrent-calls=10
resilience4j.bulkhead.instances.tracking.max-wait-duration=0
resilience4j.bulkhead.instances.inventario.max-concurrent-calls=10
resilience4j.bulkhead.instances.inventario.max-wait-duration=0
