server.port=${SERVER_PORT:8084}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/despachos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:integracion}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:integracion_dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

servicios.inventario.url=${INVENTARIO_URL:http://localhost:8081}
servicios.transportista.url=${TRANSPORTISTA_URL:http://localhost:8082}
servicios.tracking.url=${TRACKING_URL:http://localhost:8083}

# Observabilidad (evidencia del escenario 3)
management.endpoints.web.exposure.include=health,metrics,circuitbreakers,circuitbreakerevents,bulkheads,bulkheadevents
management.health.circuitbreakers.enabled=true

# Circuit Breaker sobre el transportista (dependencia frágil)
resilience4j.circuitbreaker.instances.transportista.register-health-indicator=true
resilience4j.circuitbreaker.instances.transportista.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.transportista.sliding-window-size=6
resilience4j.circuitbreaker.instances.transportista.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.transportista.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.transportista.slow-call-duration-threshold=1s
resilience4j.circuitbreaker.instances.transportista.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.transportista.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.transportista.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.transportista.ignore-exceptions=org.springframework.web.client.HttpClientErrorException,io.github.resilience4j.bulkhead.BulkheadFullException

# Bulkhead: máximo 3 llamadas concurrentes al transportista, sin cola
resilience4j.bulkhead.instances.transportista.max-concurrent-calls=3
resilience4j.bulkhead.instances.transportista.max-wait-duration=0